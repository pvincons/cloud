server {
    listen       8080;
    server_name  localhost;

    root   /path/to/your/pvincons-portal; # Thay bằng đường dẫn tuyệt đối tới thư mục dự án
    index  index.html;

    # Cấu hình UTF-8 mặc định
    charset utf-8;

    # Tối ưu hóa Static Assets Cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Điều hướng trang lỗi về Trang chủ Portal
    error_page 404 /index.html;

    # Cấu hình bảo mật Header căn bản ở Local
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}