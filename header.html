<!-- Script khởi tạo Google Translate Engine trên tên miền thực tế -->
<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'vi',
            includedLanguages: 'en,vi',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element');
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script>
    // Ép body luôn nằm ở mép trên cùng
    setInterval(function() {
        if (document.body && document.body.style.top !== '0px') {
            document.body.style.top = '0px';
        }
    }, 100);

    // Hàm đổi ngôn ngữ chuẩn hóa cho tên miền chính pvincons.com, www.pvincons.com & localhost
    function toggleLanguage() {
        var isEn = document.cookie.indexOf('/en') !== -1;
        var host = location.hostname;
        var rootDomain = host.replace(/^www\./, '');

        if (isEn) {
            // Xóa Cookie trên mọi cấp độ Domain (Root, Subdomain, Localhost)
            var pastDate = "expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;";
            document.cookie = "googtrans=; " + pastDate;
            document.cookie = "googtrans=; domain=" + host + "; " + pastDate;
            document.cookie = "googtrans=; domain=." + rootDomain + "; " + pastDate;
        } else {
            // Thiết lập Cookie dịch /vi/en đồng bộ trên mọi cấp độ Domain
            document.cookie = "googtrans=/vi/en; path=/;";
            document.cookie = "googtrans=/vi/en; path=/; domain=" + host + ";";
            document.cookie = "googtrans=/vi/en; path=/; domain=." + rootDomain + ";";
        }
        location.reload();
    }
</script>
