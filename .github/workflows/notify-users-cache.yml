name: Notify backend to refresh users cache

on:
  push:
    branches:
      - main
    paths:
      - assets/data/users.json
  workflow_dispatch:

concurrency:
  group: users-cache-sync
  cancel-in-progress: true

jobs:
  notify-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out users.json from this commit
        uses: actions/checkout@v4

      - name: Notify backend with the committed users.json
        env:
          BACKEND_API_URL: ${{ vars.BACKEND_API_URL }}
          USERS_SYNC_TOKEN: ${{ secrets.USERS_SYNC_TOKEN }}
        run: |
          test -n "$BACKEND_API_URL"
          test -n "$USERS_SYNC_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 \
            -X POST "${BACKEND_API_URL%/}/api/users/refresh" \
            -H "Authorization: Bearer ${USERS_SYNC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @assets/data/users.json
